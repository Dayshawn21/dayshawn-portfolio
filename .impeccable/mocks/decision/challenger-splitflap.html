<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#8a8f94;font-family:Archivo,sans-serif;padding:48px}
.board{background:#121212;height:100%;padding:40px;color:#f2f2ee}
h1{display:flex;gap:6px}h1 span{background:#222;border-top:1px solid #333;font-stretch:65%;font-weight:700;font-size:96px;width:72px;text-align:center;line-height:1.15}
.head{display:grid;grid-template-columns:1.6fr 1fr 1fr 220px;color:#f0a020;font-weight:700;font-stretch:70%;font-size:22px;letter-spacing:.1em;margin-top:44px;padding-bottom:10px;border-bottom:2px solid #333}
.r{display:grid;grid-template-columns:1.6fr 1fr 1fr 220px;padding:16px 0;border-bottom:1px solid #2a2a2a;font-stretch:65%;font-weight:700;font-size:40px;text-transform:uppercase}
.r .s{color:#f0a020}
</style></head><body><div class="board"><h1><span>D</span><span>T</span><span>E</span><span>R</span><span>R</span><span>Y</span></h1>

<div class="r"><span>SportApp</span><span>React · FastAPI</span><span>Full stack</span><span class="s">Building</span></div>
<div class="r"><span>Saber</span><span>React · TS</span><span>Frontend</span><span>2021–26</span></div>
<div class="r"><span>Dental platform</span><span>React · Power BI</span><span>Frontend</span><span>2021–26</span></div>
<div class="r"><span>Beacon</span><span>Blazor · .NET</span><span>Frontend</span><span>2021–26</span></div></div></body></html>
