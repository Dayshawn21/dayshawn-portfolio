<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#1f4a33;color:#f6f4ec;font-family:Archivo,sans-serif;padding:56px}
.top{display:flex;justify-content:space-between;font-weight:700;font-stretch:80%;font-size:22px;letter-spacing:.08em;color:#d9b44a}
.board{margin-top:48px;border:6px solid #4b2a6e;padding:36px;background:#1a402c}
.tiles{display:flex;gap:8px}.t{background:#f6f4ec;color:#1f4a33;font-weight:800;font-stretch:70%;font-size:128px;line-height:1;padding:12px 18px}
.role{margin-top:24px;font-size:28px}
.rows{margin-top:40px;display:grid;grid-template-columns:1fr 160px 160px 160px;border-top:2px solid #d9b44a}
.rows div{padding:18px 0;border-bottom:1px solid #3f6b52;font-size:26px;font-stretch:80%;font-weight:700}
.n{font-variant-numeric:tabular-nums;text-align:center;background:#f6f4ec;color:#1f4a33;margin:6px 6px}
.cta{margin-top:36px;display:inline-block;background:#d9b44a;color:#1f4a33;padding:18px 28px;font-weight:800;font-size:20px}
</style></head><body><div class="top"><span>WORK</span><span>EXPERIENCE</span><span>ABOUT</span><span>CONTACT</span></div>
<div class="board"><div class="tiles"><span class="t">D.</span><span class="t">TERRY</span></div><p class="role">Software engineer · frontend experience · full-stack project</p>
<div class="rows"><div>SportApp — now in development</div><div class="n">5</div><div class="n">3</div><div class="n">1</div>
<div>Visualutions — 2021–2026</div><div class="n">30</div><div class="n">55+</div><div class="n">230+</div></div></div>
<span class="cta">Watch SportApp ↓</span></body></html>
